<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Review sticker — 10×10 cm blueprint</title>
    <link rel="stylesheet" href="sticker.css" />
    <style>
      @page {
        size: 10cm 10cm;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #d8dde6;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .preview-note {
        position: fixed;
        top: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        font: 600 0.85rem/1.3 "Segoe UI", sans-serif;
        color: #333;
        background: #fff;
        border: 1px solid #cfd6e0;
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
      }

      @media print {
        html,
        body {
          background: #fff;
          padding: 0;
          min-height: 0;
        }

        .preview-note {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="preview-note screen-only">Blueprint 10×10 cm · placeholder QR · print at 100%</p>

    <article class="sticker" aria-label="Tarjeta de reseña Google">
      <header class="sticker__hero">
        <div class="sticker__hero-row">
          <div class="sticker__g-wrap">
            <img src="assets/google-g.svg" alt="Google" />
          </div>
          <div class="sticker__copy">
            <p class="sticker__copy-top">Déjanos una reseña</p>
            <p class="sticker__copy-bottom">en Google</p>
          </div>
        </div>
        <div class="sticker__stars" aria-hidden="true">
          <span class="sticker__star"></span>
          <span class="sticker__star"></span>
          <span class="sticker__star"></span>
          <span class="sticker__star"></span>
          <span class="sticker__star"></span>
        </div>
        <svg class="sticker__wave" viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#ffffff" d="M0 18 V9 Q50 0 100 9 V18 Z" />
        </svg>
      </header>

      <div class="sticker__body">
        <div class="sticker__actions">
          <div class="sticker__action">
            <p class="sticker__action-label">Acerca tu teléfono</p>
            <img class="sticker__nfc-icon" src="assets/nfc-tap.svg" alt="" />
          </div>
          <div class="sticker__divider" aria-hidden="true"></div>
          <div class="sticker__action">
            <p class="sticker__action-label">Escanear código QR</p>
            <img class="sticker__qr" src="assets/qr-placeholder.png" alt="Código QR de ejemplo" />
          </div>
        </div>

        <footer class="sticker__footer">
          <p class="sticker__footer-text">Desarrollado por</p>
          <img
            class="sticker__footer-logo"
            src="assets/iago-digital-logo.jpg"
            alt="iAGO Digital"
          />
        </footer>
      </div>
    </article>
  </body>
</html>
