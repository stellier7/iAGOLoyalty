<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Review sticker — 10×10 cm</title>
    <link rel="stylesheet" href="sticker.css" />
    <style>
      @page {
        size: 10cm 10cm;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #d8dde6;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .preview-note {
        position: fixed;
        top: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        font: 600 0.85rem/1.3 "Segoe UI", sans-serif;
        color: #333;
        background: #fff;
        border: 1px solid #cfd6e0;
        border-radius: 999px;
        padding: 0.35rem 0.85rem;
      }

      @media print {
        html,
        body {
          background: #fff;
          padding: 0;
          min-height: 0;
        }

        .preview-note {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="preview-note">Blueprint 10×10 cm · print at 100%</p>
    <article class="sticker" aria-label="Tarjeta de reseña Google">
      <img
        src="assets/sticker-master.jpg"
        alt="Déjanos una reseña en Google — Desarrollado por iAGO Digital"
      />
    </article>
  </body>
</html>
